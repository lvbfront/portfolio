<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preload" as="image" href="/me.webp" imagesrcset="/me-200.webp 200w, /me.webp 400w" imagesizes="(min-width: 1024px) 160px, 70vw" type="image/webp" fetchpriority="high" />
    <!-- /cdg and /sky-soarer only: their hero image is the LCP but lives in a lazy chunk, so start it
         now. Must match the <img> srcset/sizes in Cdg.jsx / SkySoarer.jsx. -->
    <script>
      if (location.hash.startsWith('#/cdg')) {
        const l = Object.assign(document.createElement('link'), { rel: 'preload', as: 'image', fetchPriority: 'high', imageSrcset: '/cdg/poster-500.webp 500w, /cdg/poster-700.webp 700w, /cdg/poster.webp 1400w', imageSizes: '(min-width: 1024px) 24rem, 68vw' })
        document.head.append(l)
      } else if (location.hash.startsWith('#/sky-soarer')) {
        const l = Object.assign(document.createElement('link'), { rel: 'preload', as: 'image', fetchPriority: 'high', imageSrcset: '/projects/sky-soarer/hero-500.webp 500w, /projects/sky-soarer/hero-700.webp 700w, /projects/sky-soarer/hero.webp 1400w', imageSizes: '(min-width: 1024px) 28rem, 86vw' })
        document.head.append(l)
      }
    </script>
    <title>Abdullah Bukhari — AI Engineer</title>
    <meta name="description" content="Abdullah Bukhari — AI engineer working on LLMs, computer vision and AI agents." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- non-blocking font CSS: system font paints first, Jakarta swaps in -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
